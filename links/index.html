<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogicalTech — Enlaces</title>
<meta name="description" content="Catálogos web con pedidos por WhatsApp para micronegocios de San Carlos y Alajuela. Demo gratis.">
<meta property="og:title" content="LogicalTech — Enlaces">
<meta property="og:description" content="Catálogos web con pedidos por WhatsApp. Listo en 2 a 3 días. Demo gratis.">
<meta property="og:image" content="https://logicaltechproyects-lang.github.io/logicaltech/og.jpg">
<meta property="og:url" content="https://logicaltechproyects-lang.github.io/logicaltech/links/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#3A2E25">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EBE0;--paper:#F8F4EC;--line:#CDBFA8;--walnut:#3A2E25;--bark:#6B5A4B;--cream:#EFE6D6;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--walnut);font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:40px 20px 48px;display:flex;flex-direction:column;align-items:center;gap:14px}
.owl{width:96px;height:108px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:30px;margin:6px 0 0}
h1 span{color:var(--bark);font-weight:400}
.sub{margin:0;text-align:center;color:var(--bark);font-size:15px;line-height:1.5}
nav{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:10px}
a.l{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:14px 18px;border-radius:8px;background:var(--paper);border:1px solid var(--line);color:var(--walnut);text-decoration:none;font-weight:600;font-size:16px;transition:transform .25s var(--ease)}
a.l small{display:block;font-weight:500;font-size:13px;color:var(--bark);margin-top:2px}
a.l.main{background:var(--walnut);color:var(--cream);border-color:var(--walnut)}
a.l.main small{color:#D9CCB6}
a.l:active{transform:scale(.98)}
@media (hover:hover){a.l:hover{transform:translateY(-2px)}}
footer{margin-top:18px;font-size:13px;color:var(--bark)}
</style>
</head>
<body>
<main>
  <svg class="owl" id="owl" viewBox="0 0 16 18" shape-rendering="crispEdges" role="img" aria-label="Lógico, el búho de LogicalTech"></svg>
  <h1>Logical<span>Tech</span></h1>
  <p class="sub">Catálogos web con pedidos por WhatsApp para micronegocios de San Carlos y Alajuela. Listo en 2 a 3 días.</p>
  <nav id="links"></nav>
  <footer>Ciudad Quesada, Costa Rica</footer>
</main>
<script>
/* ===== Enlaces: editar solo esta lista ===== */
const WA = "50663266186";
const LINKS = [
  {t:"Pida su demo gratis", s:"Le armamos una muestra con el nombre de su negocio", url:"https://wa.me/"+WA+"?text="+encodeURIComponent("Buenas, vi su Instagram y quiero mi demo gratis de LogicalTech."), main:true},
  {t:"Ver catálogo de servicios", s:"Servicios, paquetes y cotización", url:"../"},
  {t:"Paquetes", s:"Vitrina, Negocio en orden y Negocio digital", url:"../#paquetes"},
  {t:"Escríbanos por WhatsApp", s:"6326-6186 · todos los días, 6 a.m. a 8 p.m.", url:"https://wa.me/"+WA},
  {t:"Correo", s:"logicaltechproyects@gmail.com", url:"mailto:logicaltechproyects@gmail.com"}
];
const arrow='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
document.getElementById("links").innerHTML = LINKS.map(l=>`<a class="l${l.main?" main":""}" href="${l.url}"${/^https?:/.test(l.url)?' target="_blank" rel="noopener"':''}><span>${l.t}<small>${l.s}</small></span>${arrow}</a>`).join("");
const C={d:"#4A3826",b:"#8A6A4E",l:"#E9D9BE",s:"#CDBFA8",w:"#F8F4EC",p:"#1B1511",g:"#2B221B",a:"#E3A33B",f:"#E3A33B"};
const G=["..d..........d..","..dd........dd..","..dbbbbbbbbbbd..",".dbbbbbbbbbbbbd.",".dbggggbbggggbd.",".dgwwwwggwwwwgd.",".dgwppwggwppwgd.",".dgwppwbbwppwgd.",".dgwwwwggwwwwgd.",".dbggggaaggggbd.",".dbbbbbaabbbbbd.",".dbllllllllllbd.",".dblsllllllslbd.",".dbllllsllllbbd.",".dbllllllllllbd.","..dbllllllllbd..","...dbbbbbbbbd...","....ff....ff...."];
let h="";G.forEach((r,y)=>[...r].forEach((c,x)=>{if(C[c])h+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${C[c]}"/>`}));
document.getElementById("owl").innerHTML=h;
</script>
</body>
</html>
